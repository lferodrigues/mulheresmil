<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/jpg" sizes="192x192" href="/Logo-Mulheres-Mil.jpg">
<title>Página não encontrada | Mulheres Mil - IF Sudeste MG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--orange:#f5a623;--orange-dark:#e89400;--green:#39a845;--green-dark:#258d31;--blue:#3478d4;--text:#202124;--muted:#6b6f73;--bg:#f6f8f7}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);
  background:radial-gradient(circle at 10% 10%,rgba(245,166,35,.13),transparent 30%),radial-gradient(circle at 90% 90%,rgba(57,168,69,.12),transparent 30%),var(--bg)}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px}
.card{width:min(680px,100%);background:rgba(255,255,255,.97);border-radius:28px;padding:36px 40px 32px;text-align:center;box-shadow:0 22px 65px rgba(0,0,0,.10);border:1px solid rgba(0,0,0,.05)}
.logo{display:block;width:min(100%,300px);max-height:80px;object-fit:contain;margin:0 auto 4px}

/* ---------- cena ---------- */
.cena{display:block;width:min(100%,380px);height:auto;margin:6px auto 0;overflow:visible}
.regador{transform-box:view-box;transform-origin:70px 100px;animation:inclinar 6s ease-in-out infinite}
.gota{fill:#5aa9ef;opacity:0;animation:cair 1.1s ease-in infinite}
.g1{animation-delay:0s}.g2{animation-delay:.18s}.g3{animation-delay:.36s}
.g4{animation-delay:.54s}.g5{animation-delay:.72s}.g6{animation-delay:.9s}
.onda{fill:none;stroke:#fff;stroke-width:1.6;opacity:0;transform-box:fill-box;transform-origin:center;animation:onda 1.1s ease-out infinite}
.o1{animation-delay:.55s}.o2{animation-delay:.9s}.o3{animation-delay:1.25s}
.broto{transform-box:fill-box;transform-origin:50% 100%;animation:crescer 6s ease-in-out infinite}
.fl1,.fl2{transform-box:fill-box;transform-origin:0 100%;animation:folha 6s ease-in-out infinite}
.fl2{transform-origin:100% 100%}

@keyframes inclinar{0%,8%{transform:rotate(0)}22%,86%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
@keyframes cair{0%{transform:translateY(0);opacity:0}12%{opacity:1}80%{opacity:1}100%{transform:translateY(100px);opacity:0}}
@keyframes onda{0%{transform:scale(.3);opacity:0}25%{opacity:.8}100%{transform:scale(1.8);opacity:0}}
@keyframes crescer{0%,10%{transform:scaleY(0)}60%,90%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes folha{0%,45%{transform:scale(0)}65%,90%{transform:scale(1)}100%{transform:scale(0)}}

/* ---------- texto ---------- */
.codigo{font-size:clamp(54px,12vw,84px);font-weight:800;line-height:1;margin-top:10px;
  background:linear-gradient(90deg,var(--orange-dark),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(22px,4vw,28px);margin:10px 0 8px}
.msg{max-width:460px;margin:0 auto;color:var(--muted);font-size:15px;line-height:1.6}
.acoes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 24px;border-radius:50px;font-weight:700;font-size:14px;text-decoration:none;transition:transform .2s ease,box-shadow .2s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.14)}
.btn:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.btn.principal{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff}
.btn.sec{background:#f1f3f4;color:var(--text);border:1px solid #e1e4e6}
.footer{margin-top:26px;color:#96999c;font-size:12px;line-height:1.5}
@media(max-width:480px){.card{padding:26px 18px 24px;border-radius:20px}.btn{width:100%}}
@media(prefers-reduced-motion:reduce){.regador,.gota,.onda,.broto,.fl1,.fl2{animation:none}.gota{opacity:0}.broto,.fl1,.fl2{transform:none}}
</style>
</head>
<body>
<main class="page">
  <section class="card">
    <img src="if-sjn.png" alt="Mulheres Mil" class="logo">

    <svg class="cena" viewBox="0 0 320 250" role="img" aria-label="Um regador regando o solo, onde nasce um broto">
      <defs>
        <linearGradient id="gCorpo" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5b9be8"/><stop offset="1" stop-color="#2c63b4"/>
        </linearGradient>
        <linearGradient id="gFolha" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#258d31"/><stop offset="1" stop-color="#5cc46a"/>
        </linearGradient>
        <linearGradient id="gSolo" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8a5a3c"/><stop offset="1" stop-color="#6e4529"/>
        </linearGradient>
      </defs>

      <!-- solo -->
      <ellipse cx="215" cy="228" rx="100" ry="17" fill="url(#gSolo)"/>
      <ellipse cx="215" cy="224" rx="78" ry="10" fill="#a8704a"/>

      <!-- ondinhas onde a água cai -->
      <ellipse class="onda o1" cx="215" cy="222" rx="22" ry="4"/>
      <ellipse class="onda o2" cx="215" cy="222" rx="22" ry="4"/>
      <ellipse class="onda o3" cx="215" cy="222" rx="22" ry="4"/>

      <!-- broto que cresce -->
      <g class="broto">
        <path d="M215 224 C215 205 213 192 215 176" fill="none" stroke="#39a845" stroke-width="5" stroke-linecap="round"/>
        <g transform="translate(214 196)"><path class="fl1" d="M0 0 C-18 -2 -30 -14 -33 -28 C-15 -28 -3 -16 0 0 Z" fill="url(#gFolha)"/></g>
        <g transform="translate(216 186)"><path class="fl2" d="M0 0 C18 -2 30 -14 33 -28 C15 -28 3 -16 0 0 Z" fill="url(#gFolha)"/></g>
      </g>

      <!-- gotas -->
      <g>
        <path class="gota g1" d="M205 112 q-4 7 0 9 q4 -2 0 -9z"/>
        <path class="gota g2" d="M214 108 q-4 7 0 9 q4 -2 0 -9z"/>
        <path class="gota g3" d="M222 114 q-4 7 0 9 q4 -2 0 -9z"/>
        <path class="gota g4" d="M209 106 q-4 7 0 9 q4 -2 0 -9z"/>
        <path class="gota g5" d="M218 110 q-4 7 0 9 q4 -2 0 -9z"/>
        <path class="gota g6" d="M227 108 q-4 7 0 9 q4 -2 0 -9z"/>
      </g>

      <!-- regador (inclinado, jorrando para a direita) -->
      <g class="regador">
        <g transform="translate(40 40) rotate(28 40 50)">
          <!-- alça -->
          <path d="M8 38 C-14 38 -14 80 8 80" fill="none" stroke="#2c63b4" stroke-width="7" stroke-linecap="round"/>
          <!-- bico -->
          <path d="M72 62 L112 22 L120 30 L80 78 Z" fill="#3a78cf"/>
          <!-- chuveiro -->
          <g transform="translate(116 26) rotate(-45)">
            <rect x="-4" y="-16" width="9" height="32" rx="4" fill="#f5a623"/>
            <circle cx="1" cy="-8" r="1.3" fill="#fff"/><circle cx="1" cy="0" r="1.3" fill="#fff"/><circle cx="1" cy="8" r="1.3" fill="#fff"/>
          </g>
          <!-- corpo -->
          <rect x="4" y="30" width="76" height="62" rx="12" fill="url(#gCorpo)"/>
          <rect x="4" y="44" width="76" height="6" fill="#fff" opacity=".28"/>
          <!-- tampa -->
          <ellipse cx="42" cy="30" rx="26" ry="5" fill="#2c63b4"/>
          <!-- flor decorativa -->
          <circle cx="42" cy="68" r="9" fill="#f5a623"/><circle cx="42" cy="68" r="4" fill="#c2185b"/>
        </g>
      </g>
    </svg>

    <p class="codigo" aria-hidden="true">404</p>
    <h1>Página não encontrada</h1>
    <p class="msg">O endereço que você acessou não existe ou mudou de lugar. Enquanto isso, o broto está crescendo: volte ao início e continue de lá.</p>

    <div class="acoes">
      <a class="btn principal" href="/index.html">Voltar ao início</a>
      <a class="btn sec" href="/admin.html">Acessar o sistema</a>
    </div>

    <p class="footer">Mulheres Mil • Educação, Cidadania e Desenvolvimento Sustentável</p>
  </section>
</main>
<script src="./Assets/js/script.js"></script>
</body>
</html>
