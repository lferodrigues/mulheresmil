<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpg" sizes="192x192" href="Logo-Mulheres-Mil.jpg">
<script src="./Assets/js/script.js"></script>
<title>Login — Mulheres Mil</title>
<style>
  :root{
    --laranja: #f5a623;
    --laranja-escuro: #e07b1a;
    --vermelho: #e04b3a;
    --texto: #2c2620;
    --bg: #fdf6ec;
    --borda: #eadfcd;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    color:var(--texto);
    background: linear-gradient(135deg,#f5a623,#e8871e 55%,#e04b3a);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .login-card{
    background:#fff;
    border-radius:16px;
    box-shadow:0 10px 35px rgba(0,0,0,.25);
    padding:36px 32px;
    width:100%;
    max-width:380px;
    text-align:center;
  }
  .login-card img{
    max-width:220px;
    margin-bottom:18px;
  }
  .login-card h1{
    font-size:1.15rem;
    margin:0 0 4px;
    color:var(--texto);
  }
  .login-card p.subtitulo{
    margin:0 0 22px;
    font-size:.85rem;
    color:#8a7a63;
  }
  .campo{
    text-align:left;
    margin-bottom:14px;
  }
  .campo label{
    display:block;
    font-size:.82rem;
    font-weight:600;
    margin-bottom:5px;
    color:#5a4a30;
  }
  .campo input{
    width:100%;
    padding:11px 12px;
    border-radius:8px;
    border:1.5px solid var(--borda);
    font-size:.95rem;
    font-family:inherit;
  }
  .campo input:focus{
    outline:none;
    border-color:var(--laranja);
  }
  .btn-entrar{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:var(--laranja-escuro);
    color:#fff;
    font-weight:700;
    font-size:.95rem;
    cursor:pointer;
    transition:filter .15s ease, transform .08s ease;
  }
  .btn-entrar:hover{ filter:brightness(1.08); }
  .btn-entrar:active{ transform:scale(.98); }
  .erro{
    margin-top:14px;
    background:#fdeceb;
    color:var(--vermelho);
    border:1px solid #f4b8b0;
    padding:9px 12px;
    border-radius:8px;
    font-size:.85rem;
    display:none;
  }
  footer{
    margin-top:22px;
    font-size:.72rem;
    color:#b7a689;
  }
</style>
</head>

    <h1>Acesso ao Sistema</h1>
    <p class="subtitulo">Educação, Cidadania e Desenvolvimento Sustentável</p>

    <form id="formLogin" onsubmit="return fazerLogin(event)">
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" autocomplete="username" placeholder="@usuario" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-entrar">Entrar</button>
      <div class="erro" id="msgErro">Usuário ou senha inválidos.</div>
    </form>

    <footer>Mulheres Mil — Acesso restrito</footer>
  </div>

<script>
  const USUARIO_VALIDO = "@mulheresmilsjn";
  const SENHA_VALIDA = "Admif2026";
  const DESTINO = "menu.html";

  function fazerLogin(ev){
    ev.preventDefault();
    const usuario = document.getElementById('usuario').value.trim();
    const senha = document.getElementById('senha').value;
    const erro = document.getElementById('msgErro');

    if(usuario === USUARIO_VALIDO && senha === SENHA_VALIDA){
      sessionStorage.setItem('mm_logado', '1');
      sessionStorage.setItem('mm_usuario', usuario);
      window.location.href = DESTINO;
    } else {
      erro.style.display = 'block';
    }
    return false;
  }

  // Se já estiver logado, vai direto pro menu
  if(sessionStorage.getItem('mm_logado') === '1'){
    window.location.href = DESTINO;
  }
</script>
</body>
